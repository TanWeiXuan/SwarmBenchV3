name: Ranking Tournament

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [official, exhibition]
        default: exhibition
      size:
        type: choice
        options: [small, default, large]
        default: small
      seed:
        type: string
        required: false

concurrency:
  group: swarmbench-v3-tournament-${{ github.event_name == 'schedule' && 'official' || inputs.mode }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare frozen V3 schedule
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[competition]"
      - env:
          MODE: ${{ github.event_name == 'schedule' && 'official' || inputs.mode }}
          SIZE: ${{ github.event_name == 'schedule' && 'default' || inputs.size }}
          SEED: ${{ inputs.seed }}
        run: python -m swarmbench.competition.automation prepare --ratings leaderboard/ratings.json --mode "$MODE" --size "$SIZE" --seed "$SEED" --run-id "${{ github.run_id }}" --repository "${{ github.repository }}" --output plan.json
      - id: matrix
        run: echo "value=$(jq -c '.batches|to_entries|map({batch:.key,label:(.key+1)})|{include:.}' plan.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: tournament-context, path: plan.json, retention-days: 30}

  reporter:
    name: Maintain permanent Tournament Results Discussion
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      discussions: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[competition]"
      - uses: actions/download-artifact@v4
        with: {name: tournament-context, path: context}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python -m swarmbench.competition.automation live-report --plan context/plan.json --run-id "${{ github.run_id }}" --output discussion.json
      - uses: actions/upload-artifact@v4
        with: {name: tournament-discussion, path: discussion.json, retention-days: 30}

  compute:
    name: Compute batch ${{ matrix.label }} (untrusted controllers)
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 19
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[competition]"
      - run: docker build --tag swarmbench-v3-controller --file Dockerfile.controller .
      - uses: actions/download-artifact@v4
        with: {name: tournament-context, path: context}
      - env:
          SWARMBENCH_BACKEND: docker
        run: python -m swarmbench.competition.automation compute --plan context/plan.json --batch "${{ matrix.batch }}" --output "batch-${{ matrix.batch }}.json" --replay-dir replays
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-batch-${{ matrix.batch }}
          path: |
            batch-${{ matrix.batch }}.json
            replays/
          retention-days: 30

  render-media:
    name: Render selected tournament media (credential-free)
    needs: compute
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[render]"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - uses: actions/download-artifact@v4
        with: {pattern: tournament-batch-*, path: batches, merge-multiple: true}
      - run: python -m swarmbench.competition.media render --replays batches --output media --run-id "${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        with: {name: tournament-media, path: media/, retention-days: 90}

  final:
    name: Validate every batch and publish ratings atomically
    needs: [compute, reporter]
    runs-on: ubuntu-latest
    concurrency:
      group: swarmbench-v3-rating-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      discussions: write
    steps:
      - name: Create short-lived publication token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SWARMBENCH_APP_ID }}
          private-key: ${{ secrets.SWARMBENCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0, token: "${{ steps.app-token.outputs.token }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[competition]"
      - uses: actions/download-artifact@v4
        with: {name: tournament-context, path: context}
      - uses: actions/download-artifact@v4
        with: {pattern: tournament-batch-*, path: batches, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {name: tournament-discussion, path: discussion}
      - run: python -m swarmbench.competition.automation final --plan context/plan.json --batches batches --ratings leaderboard/ratings.json --readme README.md --output tournament-result.json
      - name: Append final trusted Discussion result
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m swarmbench.competition.automation comment --discussion-id "$(jq -r .id discussion/discussion.json)" --result tournament-result.json
      - name: Open official rating PR
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'official' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name swarmbench-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -b "bot/v3-tournament-${{ github.run_id }}"
          git add leaderboard/ratings.json README.md
          git commit -m "chore: publish V3 tournament ${{ github.run_id }} ratings"
          git push --set-upstream origin "bot/v3-tournament-${{ github.run_id }}"
          url=$(gh pr create --title "Publish V3 tournament ${{ github.run_id }} ratings" --body "Atomic current-state update from a complete validated period." --base main --head "bot/v3-tournament-${{ github.run_id }}")
          gh pr merge "$url" --auto --squash
          bash .github/scripts/wait-for-pr-merge.sh "$url"
      - uses: actions/upload-artifact@v4
        with: {name: tournament-results, path: tournament-result.json, retention-days: 90}

  publish-media:
    name: Publish durable media assets
    needs: [render-media, final]
    if: ${{ always() && needs.final.result == 'success' && needs.render-media.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      discussions: write
    steps:
      - name: Create short-lived media token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SWARMBENCH_APP_ID }}
          private-key: ${{ secrets.SWARMBENCH_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[competition]"
      - uses: actions/download-artifact@v4
        with: {name: tournament-media, path: media}
      - uses: actions/download-artifact@v4
        with: {name: tournament-discussion, path: discussion}
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python -m swarmbench.competition.media publish --directory media --repository "${{ github.repository }}" --run-id "${{ github.run_id }}" --links media-links.json
      - name: Append actual returned asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -r '"### Tournament media\n\n" + (.asset_urls | map("- " + .) | join("\n"))' media-links.json > media-comment.md
          gh api graphql -f query='mutation($id:ID!,$body:String!){addDiscussionComment(input:{discussionId:$id,body:$body}){comment{id}}}' -f id="$(jq -r .id discussion/discussion.json)" -F body=@media-comment.md
